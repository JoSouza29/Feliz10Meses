<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz 10 Meses, Meu amor!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#f29ab9; --bg2:#d9648f; --bg3:#a93a68; --bg4:#6a1a43;
  --text:#fff; --string:rgba(255,230,240,.8); --card:#fffdfd; --shadow:rgba(60,0,30,.5);
  --ph1:#ffe6ee; --ph2:#ffb9d0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#cf6a92;--bg2:#ab4470;--bg3:#7d2650;--bg4:#4a1130}
}
:root[data-theme="dark"]{--bg1:#cf6a92;--bg2:#ab4470;--bg3:#7d2650;--bg4:#4a1130}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;height:100dvh;overflow:hidden;position:relative;color:var(--text);
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 32%,var(--bg3) 68%,var(--bg4) 100%);
  background-size:100% 150%;background-color:var(--bg3);animation:bgshift 16s ease-in-out infinite alternate;
  font-family:"Great Vibes","Brush Script MT",cursive;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 48%,rgba(50,0,25,.45) 100%)}
@keyframes bgshift{from{background-position:50% 0}to{background-position:50% 100%}}

/* fundo: raios de luz, coração, bolhas, partículas */
.rays{position:fixed;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.08) 0 7deg,transparent 7deg 18deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 8%,transparent 68%);mask-image:radial-gradient(closest-side,#000 8%,transparent 68%);
  animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.heart{position:fixed;left:50%;top:50%;width:min(112vw,118vh);pointer-events:none;opacity:.55;transform:translate(-50%,-50%);animation:pulse 4.5s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,255,255,.55))}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.045)}}
.bokeh{position:fixed;inset:0;pointer-events:none;filter:blur(3px);
  background:
   radial-gradient(circle at 8% 22%,rgba(255,255,255,.17) 0 70px,transparent 72px),
   radial-gradient(circle at 92% 14%,rgba(255,200,225,.2) 0 90px,transparent 92px),
   radial-gradient(circle at 18% 80%,rgba(255,180,210,.15) 0 110px,transparent 112px),
   radial-gradient(circle at 86% 74%,rgba(255,255,255,.13) 0 80px,transparent 82px),
   radial-gradient(circle at 60% 94%,rgba(255,190,215,.16) 0 60px,transparent 62px)}
#fx i{position:fixed;font-style:normal;pointer-events:none;z-index:0}
#fx .h{left:var(--x);bottom:-40px;font-size:var(--s);color:#ffc9dd;opacity:0;animation:fly var(--t) linear var(--d) infinite}
#fx .sp{left:var(--x);top:var(--y);font-size:var(--s);color:#fff;opacity:0;animation:tw 3.2s ease-in-out var(--d) infinite}
#fx .pt{left:var(--x);top:-30px;width:11px;height:15px;border-radius:80% 10% 80% 10%;background:linear-gradient(135deg,#fff,#ffc4d9);opacity:0;animation:fall var(--t) linear var(--d) infinite}
@keyframes fly{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.75}100%{transform:translateY(-115vh) rotate(30deg);opacity:0}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.95;transform:scale(1.15) rotate(45deg)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.85}100%{transform:translate(70px,112vh) rotate(540deg);opacity:0}}

/* layout: fotos | buquê com o texto por cima | fotos */
main{height:100%;position:relative;z-index:1;padding:clamp(6px,1.5vh,18px) 6px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(2px,1vh,12px)}
.content{--sw:min(56vh,44vw);--ov:calc(var(--sw)*-.05);width:100%;height:100%;display:grid;grid-template-columns:1fr var(--sw) 1fr;align-items:center}

/* buquê + texto */
.stage{position:relative;z-index:2;width:var(--sw);aspect-ratio:400/450;container-type:inline-size;animation:deliver 2s cubic-bezier(.22,1,.36,1) 1s both}
.halo{position:absolute;inset:0 -8%;background:radial-gradient(closest-side,rgba(255,238,247,.6),rgba(255,200,225,.22) 55%,transparent 78%);animation:breathe 4s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.65;transform:scale(.97)}to{opacity:1;transform:scale(1.05)}}
.bouquet{display:block;position:relative;width:100%;height:100%;transform-origin:50% 92%;animation:sway 5.5s ease-in-out 3.2s infinite alternate;filter:drop-shadow(0 24px 20px rgba(45,0,22,.65)) drop-shadow(0 4px 6px rgba(45,0,22,.4))}
.st{position:absolute;left:var(--l);top:var(--t);font-style:normal;font-size:5cqw;color:#fff;text-shadow:0 0 8px #fff,0 0 16px #ff9fc4;opacity:0;z-index:5;animation:tw 2.8s ease-in-out var(--d) infinite}
@keyframes deliver{0%{opacity:0;transform:translateY(90%) scale(.7) rotate(-8deg)}55%{opacity:1;transform:translateY(-4%) scale(1.04) rotate(3deg)}75%{transform:translateY(1%) scale(.99) rotate(-1deg)}100%{opacity:1;transform:none}}
@keyframes sway{from{transform:rotate(-1.6deg) translateY(0)}to{transform:rotate(1.6deg) translateY(-6px)}}

h1{--fs:clamp(44px,min(9vw,13.5vh),150px);position:relative;z-index:4;margin:0;pointer-events:none;text-align:center;font-weight:400;line-height:1;display:flex;flex-direction:column;align-items:center;color:#fff;
  text-shadow:0 3px 0 rgba(120,20,70,.6),0 0 8px #b3215a,0 0 20px rgba(179,33,90,.9),0 8px 22px rgba(50,0,25,.6);animation:glow 3s ease-in-out 3.6s infinite alternate}
h1::before{content:"";position:absolute;inset:-6% 10% -10%;z-index:-1;background:radial-gradient(closest-side,rgba(130,20,70,.4),transparent 80%)}
h1 .a{font-size:var(--fs);white-space:nowrap;--b:.3s}
h1 .row{display:flex;align-items:center;justify-content:center;gap:.2em;font-size:calc(var(--fs)*.62);margin-top:.02em}
h1 .b{--b:1.5s}
.l{display:inline-block;animation:letter .9s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:calc(var(--b) + var(--i)*70ms)}
.w{display:inline-block;white-space:nowrap}
.p{--b:3.2s;margin:0 auto;max-width:94vw;text-align:center;line-height:1.1;font-size:clamp(20px,min(4.2vw,5.6vh),60px);color:#fff;text-wrap:balance;pointer-events:none;
  text-shadow:0 2px 0 rgba(120,20,70,.55),0 0 10px rgba(179,33,90,.85),0 4px 14px rgba(50,0,25,.5)}
.p .l{animation-duration:.8s;animation-delay:calc(var(--b) + var(--i)*45ms)}
.hb{display:inline-block;color:#ffb3cf;animation:pop .9s cubic-bezier(.2,.9,.3,1.7) 2.6s both,beat 1.5s ease-in-out 3.6s infinite}
@keyframes glow{from{text-shadow:0 2px 0 rgba(120,20,70,.6),0 0 6px #b3215a,0 0 14px rgba(179,33,90,.8),0 6px 18px rgba(50,0,25,.6)}to{text-shadow:0 2px 0 rgba(120,20,70,.6),0 0 8px #ff7fae,0 0 26px rgba(255,120,170,.95),0 6px 18px rgba(50,0,25,.6)}}
@keyframes letter{from{opacity:0;transform:translateY(.55em) scale(.5) rotate(-10deg)}}
@keyframes pop{from{opacity:0;transform:scale(0)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}

/* fotos ao lado do buquê */
.wall{--gap:clamp(12px,2.4vh,26px);--dur:30s;--ww:min(30vh,21vw);--pw:.8;position:relative;z-index:1;overflow:hidden;
  width:var(--ww);height:calc(var(--ww)*var(--pw)*2.4 + var(--gap)*2);align-self:center;
  -webkit-mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent);
  animation:wallIn 1.2s ease-out 2s both}
.wall::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--string)}
.wall.l{justify-self:end;margin-right:var(--ov);--dx:-50px}
.wall.r{justify-self:start;margin-left:var(--ov);--dx:50px}
.track{display:flex;flex-direction:column;animation:up var(--dur) linear infinite;will-change:transform}
.wall.dn .track{animation-name:down}
.wall:hover .track{animation-play-state:paused}
.pol{position:relative;flex:none;width:calc(var(--pw)*100%);margin:0 auto var(--gap);aspect-ratio:5/6;background:var(--card);padding:6% 6% 0;border-radius:3px;
  box-shadow:0 10px 22px var(--shadow),0 2px 4px rgba(0,0,0,.15);transform:rotate(var(--r,-2deg))}
.pol:nth-child(5n+2){--r:2.5deg}.pol:nth-child(5n+4){--r:-3deg}
.pol::before{content:"";position:absolute;top:-8px;left:50%;width:13px;height:22px;margin-left:-6px;background:var(--pin,#f48fb1);border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.25);z-index:2}
.pol:nth-child(5n+2)::before{--pin:#ffc2d4}.pol:nth-child(5n+3)::before{--pin:#e86a99}
.pol::after{content:"♡";position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#e86a99;font:clamp(9px,1.5vw,18px)/1 sans-serif}
.ph{width:100%;height:80%;border-radius:2px;box-shadow:inset 0 0 10px rgba(0,0,0,.18);
  /* Para colocar sua foto: style="--img:url('foto.jpg')" no .ph */
  background-image:var(--img,linear-gradient(135deg,var(--ph1),var(--ph2)));background-size:cover;background-position:center;
  display:grid;place-items:center;color:#fff;font-size:clamp(12px,1.8vw,24px)}
.ph:not([style])::after{content:"♥";opacity:.85}
@keyframes up{to{transform:translateY(-50%)}}
@keyframes down{from{transform:translateY(-50%)}to{transform:none}}
@keyframes wallIn{from{opacity:0;transform:translateX(var(--dx))}}

/* celular: mesmas fotos ao lado, maiores, com uma ponta escondida atrás do buquê */
@media (max-width:820px){
  .content{--sw:68vw;--ov:-8vw}
  h1{--fs:clamp(44px,14.5vw,80px)}
  .p{font-size:clamp(22px,6.4vw,40px)}
  .wall{--ww:24vw;--pw:.88;--gap:12px;--dur:26s}
}
@media (prefers-reduced-motion:reduce){#fx,.rays{display:none}body,.heart,h1,.l,.hb,.stage,.bouquet,.halo,.st,.wall,.track{animation:none!important}}
</style>
</head>
<body>
<div class="rays" aria-hidden="true"></div>
<svg class="heart" viewBox="-4 -4 208 184" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffc2da"/></linearGradient></defs><path d="M100 170C20 110 0 70 0 45C0 18 20 2 45 2C68 2 88 16 100 36C112 16 132 2 155 2C180 2 200 18 200 45C200 70 180 110 100 170Z" fill="none" stroke="url(#hg)" stroke-width="1.4" stroke-dasharray="2 4" stroke-linecap="round"/></svg>

<main>
  <h1 aria-label="Feliz 10 Meses, Meu amor!"><span class="a" aria-hidden="true">Feliz 10 Meses,</span><span class="row" aria-hidden="true"><span class="b">Meu amor!</span><span class="hb">❤︎</span></span></h1>
  <div class="content">
    <!-- Fotos: troque o link dentro de url('...'). O JS repete as mesmas para o loop -->
    <section class="wall l" aria-label="Memórias">

    </section>

    <div class="stage">
      <div class="halo"></div>
      <svg class="bouquet" viewBox="0 0 400 450" role="img" aria-label="Buquê de rosas brancas com mosquitinho azul">
        <defs>
          <filter id="bl"><feGaussianBlur stdDeviation="6"/></filter>
          <radialGradient id="pg" cx="0" cy="0" r="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e6d0c0"/><stop offset=".5" stop-color="#fff8f0"/><stop offset="1" stop-color="#fff"/></radialGradient>
          <linearGradient id="lg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#287e42"/><stop offset=".55" stop-color="#4fae68"/><stop offset="1" stop-color="#7fd193"/></linearGradient>
          <linearGradient id="rb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffc0d6"/><stop offset="1" stop-color="#ec7aa4"/></linearGradient>
          <path id="pet" d="M0 -2C-32 -6 -38 -40 -16 -52C-6 -57 6 -57 16 -52C38 -40 32 -6 0 -2Z" fill="url(#pg)" stroke="#d9c5b6" stroke-width="1.2"/>
          <g id="rose">
            <circle r="54" fill="#5a3a30" opacity=".22"/>
            <use href="#pet"/><use href="#pet" transform="rotate(72)"/><use href="#pet" transform="rotate(144)"/><use href="#pet" transform="rotate(216)"/><use href="#pet" transform="rotate(288)"/>
            <use href="#pet" transform="rotate(36) scale(.78)"/><use href="#pet" transform="rotate(108) scale(.78)"/><use href="#pet" transform="rotate(180) scale(.78)"/><use href="#pet" transform="rotate(252) scale(.78)"/><use href="#pet" transform="rotate(324) scale(.78)"/>
            <use href="#pet" transform="rotate(15) scale(.55)"/><use href="#pet" transform="rotate(105) scale(.55)"/><use href="#pet" transform="rotate(195) scale(.55)"/><use href="#pet" transform="rotate(285) scale(.55)"/>
            <use href="#pet" transform="rotate(60) scale(.32)"/><use href="#pet" transform="rotate(200) scale(.3)"/>
            <path d="M0 0c4-5 9-2 8 3s-9 8-14 3s0-14 9-13" fill="none" stroke="#c9b2a2" stroke-width="1.3" stroke-linecap="round"/>
          </g>
          <g id="leaf"><path d="M0 0Q28 -55 0 -140Q-28 -55 0 0Z" fill="url(#lg)" stroke="#256f3b" stroke-width="1.5"/><path d="M0 0V-130" stroke="#a6e2b3" stroke-width="2" fill="none"/><path d="M0 -25L15 -40M0 -25L-15 -40M0 -55L17 -72M0 -55L-17 -72M0 -85L11 -99M0 -85L-11 -99" stroke="#8fd29c" stroke-width="1.2" fill="none" opacity=".8"/></g>
        </defs>
        <ellipse cx="200" cy="437" rx="108" ry="10" fill="#2a0014" opacity=".6" filter="url(#bl)"/>
        <g transform="translate(200 215)">
          <use href="#leaf" transform="rotate(-125) scale(1.3)"/><use href="#leaf" transform="rotate(-72) scale(1.35)"/>
          <use href="#leaf" transform="rotate(32) scale(1.4)"/><use href="#leaf" transform="rotate(78) scale(1.3)"/>
          <use href="#leaf" transform="rotate(128) scale(1.3)"/><use href="#leaf" transform="rotate(-22) scale(1.3)"/>
        </g>
        <g stroke="#4a9a5c" stroke-width="5" stroke-linecap="round" fill="none"><path d="M200 300V424"/><path d="M158 290Q190 340 198 424"/><path d="M242 290Q210 340 202 424"/><path d="M180 300Q192 350 199 424" stroke-width="4"/></g>
        <path d="M168 336L232 336L224 402L176 402Z" fill="url(#rb)" stroke="#d9608f" stroke-width="1.5"/>
        <path d="M172 352H228M174 372H226" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>
        <g transform="translate(200 342)" fill="url(#rb)" stroke="#d9608f" stroke-width="2"><path d="M0 0Q-40 -26 -44 6Q-30 26 0 0Z"/><path d="M0 0Q40 -26 44 6Q30 26 0 0Z"/><path d="M0 0L-22 52Q-14 58 -8 50ZM0 0L22 52Q14 58 8 50Z"/><circle r="9"/></g>
        <g id="back"></g>
        <g>
          <use href="#rose" transform="translate(200 90) rotate(10) scale(.88)"/>
          <use href="#rose" transform="translate(120 120) rotate(40) scale(.9)"/>
          <use href="#rose" transform="translate(282 120) rotate(-20) scale(.9)"/>
          <use href="#rose" transform="translate(84 198) rotate(70) scale(.85)"/>
          <use href="#rose" transform="translate(316 198) rotate(25) scale(.87)"/>
          <use href="#rose" transform="translate(120 278) rotate(-40) scale(.9)"/>
          <use href="#rose" transform="translate(280 278) rotate(55) scale(.9)"/>
          <use href="#rose" transform="translate(200 300) rotate(15) scale(.8)"/>
          <use href="#rose" transform="translate(148 150) rotate(100) scale(.76)"/>
          <use href="#rose" transform="translate(252 150) rotate(-60) scale(.76)"/>
          <use href="#rose" transform="translate(148 248) rotate(20) scale(.74)"/>
          <use href="#rose" transform="translate(252 248) rotate(80) scale(.74)"/>
          <use href="#rose" transform="translate(200 198) rotate(30) scale(.98)"/>
        </g>
        <g id="front"></g>
      </svg>
      <i class="st" style="--l:4%;--t:20%;--d:0s">✦</i><i class="st" style="--l:90%;--t:14%;--d:.7s">✦</i><i class="st" style="--l:94%;--t:58%;--d:1.4s">✦</i>
      <i class="st" style="--l:2%;--t:62%;--d:2.1s">✦</i><i class="st" style="--l:76%;--t:88%;--d:.4s">✦</i><i class="st" style="--l:18%;--t:90%;--d:1.8s">✦</i>
      </div>
    </div>

    <section class="wall r dn" aria-label="Memórias">
      <div class="track"><figure class="pol"><div class="ph" style="--img:url('https://i.ibb.co/Rpc7LZvg/Whats-App-Image-2026-10-16-at-04-16-40-1.jpg')"></div></figure><figure class="pol"><div class="ph" style="--img:url('https://i.ibb.co/hJvgqgTk/Whats-App-Image-2026-10-16-at-04-16-40.jpg')"></div></figure><figure class="pol"><div class="ph" style="--img:url('https://i.ibb.co/tMnyKfMX/Whats-App-Image-2026-10-16-at-04-16-39-2.jpg')"></div></figure><figure class="pol"><div class="ph" style="--img:url('https://i.ibb.co/pBrCbfxk/Whats-App-Image-2026-10-16-at-04-16-39-1.jpg')"></div></figure><figure class="pol"><div class="ph" style="--img:url('https://i.ibb.co/dFnpw19/Whats-App-Image-2026-10-16-at-04-16-39.jpg')"></div></figure></div>
    </section>
  </div>
  <p class="p" aria-label="Eu te amo minha papoia, agora e para sempre!">Eu te amo minha papoia, agora e para sempre!</p>
</main>
<script>
(function(){
  var s=11,r=function(){return (s=(s*16807)%2147483647)/2147483647},C=['#35a7e6','#5bbcf0','#1f86c8','#7fd0f7'];
  function dots(n,a0,a1,stem){var o='';for(var i=0;i<n;i++){var a=r()*6.283,d=a0+r()*(a1-a0),cx=200+Math.cos(a)*d,cy=205+Math.sin(a)*d*.9,k=5+(r()*4|0);
    if(stem)o+='<path d="M200 215Q'+((200+cx)/2+8)+' '+((215+cy)/2)+' '+cx.toFixed(1)+' '+cy.toFixed(1)+'" stroke="#8cc79a" stroke-width=".9" fill="none"/>';
    for(var j=0;j<k;j++){var x=cx+(r()-.5)*36,y=cy+(r()-.5)*36,q=2.8+r()*2.8;
      o+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+q.toFixed(1)+'" fill="'+C[r()*4|0]+'"/><circle cx="'+(x-q*.3).toFixed(1)+'" cy="'+(y-q*.3).toFixed(1)+'" r="'+(q*.3).toFixed(1)+'" fill="#fff" opacity=".65"/>'}}return o}
  document.getElementById('back').innerHTML=dots(30,100,172,1);
  document.getElementById('front').innerHTML=dots(10,95,160,0);
  var h='',i;
  for(i=0;i<14;i++)h+='<i class="h" style="--x:'+(r()*100).toFixed(0)+'%;--d:'+(r()*10).toFixed(1)+'s;--s:'+(12+r()*22).toFixed(0)+'px;--t:'+(8+r()*6).toFixed(1)+'s">♥</i>';
  for(i=0;i<22;i++)h+='<i class="sp" style="--x:'+(r()*100).toFixed(0)+'%;--y:'+(r()*100).toFixed(0)+'%;--d:'+(r()*4).toFixed(1)+'s;--s:'+(8+r()*14).toFixed(0)+'px">✦</i>';
  for(i=0;i<12;i++)h+='<i class="pt" style="--x:'+(r()*100).toFixed(0)+'%;--d:'+(r()*12).toFixed(1)+'s;--t:'+(9+r()*6).toFixed(1)+'s"></i>';
  document.getElementById('fx').innerHTML=h;
  document.querySelectorAll('.a,.b,.p').forEach(function(el){var i=0;el.innerHTML=el.textContent.split(' ').map(function(w){return '<span class="w">'+Array.from(w).map(function(c){return '<span class="l" style="--i:'+(i++)+'">'+c+'</span>'}).join('')+'</span>'}).join(' ')});
  document.querySelectorAll('.track').forEach(function(t){Array.from(t.children).forEach(function(f){var c=f.cloneNode(true);c.setAttribute('aria-hidden','true');t.appendChild(c)})});
})();
</script>
</body>
</html>

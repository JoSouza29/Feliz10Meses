<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz 10 Meses, Meu amor!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#ee8fb3; --bg2:#d4628c; --bg3:#a93a68; --bg4:#6e1c44;
  --text:#fff0f6; --string:rgba(255,225,238,.7); --card:#fffdfd; --shadow:rgba(60,0,30,.5);
  --ph1:#ffe6ee; --ph2:#ffb9d0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#c9628a;--bg2:#a8416b;--bg3:#7d2650;--bg4:#4d1230}
}
:root[data-theme="dark"]{--bg1:#c9628a;--bg2:#a8416b;--bg3:#7d2650;--bg4:#4d1230}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;position:relative;color:var(--text);
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 35%,var(--bg3) 70%,var(--bg4) 100%);
  background-color:var(--bg3);font-family:"Great Vibes","Brush Script MT",cursive;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(50,0,25,.4) 100%)}
.bokeh{position:fixed;inset:0;pointer-events:none;filter:blur(3px);
  background:
   radial-gradient(circle at 8% 22%,rgba(255,255,255,.16) 0 70px,transparent 72px),
   radial-gradient(circle at 92% 14%,rgba(255,200,225,.18) 0 90px,transparent 92px),
   radial-gradient(circle at 18% 78%,rgba(255,180,210,.14) 0 110px,transparent 112px),
   radial-gradient(circle at 84% 72%,rgba(255,255,255,.12) 0 80px,transparent 82px),
   radial-gradient(circle at 60% 92%,rgba(255,190,215,.15) 0 60px,transparent 62px)}
#fx i{position:fixed;font-style:normal;pointer-events:none;z-index:0}
#fx .h{left:var(--x);bottom:-40px;font-size:var(--s);color:#ffc9dd;opacity:0;animation:up var(--t) linear var(--d) infinite}
#fx .sp{left:var(--x);top:var(--y);font-size:var(--s);color:#fff;opacity:0;animation:tw 3.2s ease-in-out var(--d) infinite}
#fx .pt{left:var(--x);top:-30px;width:11px;height:15px;border-radius:80% 10% 80% 10%;background:linear-gradient(135deg,#fff,#ffc4d9);opacity:0;animation:fall var(--t) linear var(--d) infinite}
@keyframes up{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.75}100%{transform:translateY(-115vh) rotate(30deg);opacity:0}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.95;transform:scale(1.15) rotate(45deg)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.85}100%{transform:translate(70px,112vh) rotate(540deg);opacity:0}}
main{height:100%;display:grid;grid-template-rows:auto 1fr;position:relative;z-index:1;padding:clamp(4px,1.2vh,16px) clamp(8px,2vw,32px) clamp(8px,1.5vh,20px)}
h1{
  margin:0;text-align:center;font-weight:400;line-height:1;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(180deg,#fff 10%,#ffe3ee 55%,#ffb6d0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(120,20,70,.4)) drop-shadow(0 8px 16px rgba(50,0,25,.5));
}
h1 .a{font-size:clamp(34px,min(7.2vw,11.5vh),120px)}
h1 .b{font-size:clamp(42px,min(9vw,14.5vh),150px);margin-top:-.04em}
.content{display:grid;grid-template-columns:.8fr 1.7fr .8fr;gap:clamp(4px,1.6vw,28px);align-items:center;min-height:0}
.stage{position:relative;height:100%;min-height:0;display:grid}
.halo{position:absolute;inset:2% 0;background:radial-gradient(closest-side,rgba(255,236,246,.55),rgba(255,200,225,.2) 55%,transparent 78%)}
.bouquet{position:relative;width:100%;height:100%;min-height:0;filter:drop-shadow(0 24px 20px rgba(45,0,22,.65)) drop-shadow(0 4px 6px rgba(45,0,22,.4))}
.wall{display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,1vw,14px);height:66%;min-height:0}
.col{position:relative;display:grid;grid-template-rows:repeat(3,1fr);min-height:0}
.col::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--string)}
.col:nth-child(2){padding-top:8%}
.pol{position:relative;margin:auto;height:88%;max-width:96%;aspect-ratio:5/6;background:var(--card);padding:7% 7% 0;border-radius:3px;
  box-shadow:0 8px 16px var(--shadow);transform:rotate(var(--r,-2deg));transition:transform .3s}
.pol::after{content:"♡";position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#e86a99;font:clamp(8px,1.4vw,18px)/1 sans-serif}
.pol:hover{transform:rotate(0) scale(1.1);z-index:3}
.pol:nth-child(2n){--r:2.5deg}.pol:nth-child(3n){--r:-3deg}
.pol::before{content:"";position:absolute;top:-8px;left:50%;width:13px;height:22px;margin-left:-6px;background:var(--pin,#f48fb1);border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.25);z-index:2}
.pol:nth-child(2)::before{--pin:#ffc2d4}.pol:nth-child(3)::before{--pin:#e86a99}
.ph{width:100%;height:76%;border-radius:2px;
  /* Para colocar sua foto: style="--img:url('foto.jpg')" no .ph */
  background-image:var(--img,linear-gradient(135deg,var(--ph1),var(--ph2)));background-size:cover;background-position:center;
  display:grid;place-items:center;color:#fff;font-size:clamp(12px,1.8vw,24px)}
.ph:not([style])::after{content:"♥";opacity:.85}
@media (prefers-reduced-motion:reduce){#fx{display:none}.pol{transition:none}}
@media (max-width:820px){
  body{height:100dvh}
  main{padding:6px 6px 10px}
  h1 .a{font-size:clamp(38px,12.5vw,70px)}
  h1 .b{font-size:clamp(46px,15.5vw,86px)}
  .content{grid-template-columns:22vw 1fr 22vw;gap:0}
  .stage{height:auto;align-self:center;margin:0 -3vw;z-index:2}
  .bouquet{height:auto}
  .halo{inset:-8% -6%}
  .wall{grid-template-columns:1fr;height:82%}
  .col:nth-child(2){display:none}
  .pol{height:auto;width:84%;max-width:none;padding:8% 8% 0}
  .pol::before{width:9px;height:15px;margin-left:-4px;top:-6px}
}
</style>
</head>
<body>
<div class="bokeh" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<main>
  <h1><span class="a">Feliz 10 Meses,</span><span class="b">Meu amor! ❤︎</span></h1>
  <div class="content">
    <section class="wall" aria-label="Memórias">
      <div class="col"><figure class="pol"><div class="ph"></div></figure><figure class="pol"><div class="ph"></div></figure><figure class="pol"><div class="ph"></div></figure></div>
      <div class="col"><figure class="pol"><div class="ph"></div></figure><figure class="pol"><div class="ph"></div></figure><figure class="pol"><div class="ph"></div></figure></div>
    </section>

    <div class="stage">
      <div class="halo"></div>
      <svg class="bouquet" viewBox="0 0 400 450" role="img" aria-label="Buquê de rosas brancas com mosquitinho azul">
        <defs>
          <filter id="bl"><feGaussianBlur stdDeviation="6"/></filter>
          <radialGradient id="pg" cx="0" cy="0" r="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e6d0c0"/><stop offset=".5" stop-color="#fff8f0"/><stop offset="1" stop-color="#fff"/></radialGradient>
          <linearGradient id="lg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#287e42"/><stop offset=".55" stop-color="#4fae68"/><stop offset="1" stop-color="#7fd193"/></linearGradient>
          <linearGradient id="rb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffc0d6"/><stop offset="1" stop-color="#ec7aa4"/></linearGradient>
          <path id="pet" d="M0 -2C-32 -6 -38 -40 -16 -52C-6 -57 6 -57 16 -52C38 -40 32 -6 0 -2Z" fill="url(#pg)" stroke="#d9c5b6" stroke-width="1.2"/>
          <g id="rose">
            <circle r="54" fill="#5a3a30" opacity=".22"/>
            <use href="#pet"/><use href="#pet" transform="rotate(72)"/><use href="#pet" transform="rotate(144)"/><use href="#pet" transform="rotate(216)"/><use href="#pet" transform="rotate(288)"/>
            <use href="#pet" transform="rotate(36) scale(.78)"/><use href="#pet" transform="rotate(108) scale(.78)"/><use href="#pet" transform="rotate(180) scale(.78)"/><use href="#pet" transform="rotate(252) scale(.78)"/><use href="#pet" transform="rotate(324) scale(.78)"/>
            <use href="#pet" transform="rotate(15) scale(.55)"/><use href="#pet" transform="rotate(105) scale(.55)"/><use href="#pet" transform="rotate(195) scale(.55)"/><use href="#pet" transform="rotate(285) scale(.55)"/>
            <use href="#pet" transform="rotate(60) scale(.32)"/><use href="#pet" transform="rotate(200) scale(.3)"/>
            <path d="M0 0c4-5 9-2 8 3s-9 8-14 3s0-14 9-13" fill="none" stroke="#c9b2a2" stroke-width="1.3" stroke-linecap="round"/>
          </g>
          <g id="leaf"><path d="M0 0Q28 -55 0 -140Q-28 -55 0 0Z" fill="url(#lg)" stroke="#256f3b" stroke-width="1.5"/><path d="M0 0V-130" stroke="#a6e2b3" stroke-width="2" fill="none"/><path d="M0 -25L15 -40M0 -25L-15 -40M0 -55L17 -72M0 -55L-17 -72M0 -85L11 -99M0 -85L-11 -99" stroke="#8fd29c" stroke-width="1.2" fill="none" opacity=".8"/></g>
        </defs>
        <ellipse cx="200" cy="437" rx="108" ry="10" fill="#2a0014" opacity=".6" filter="url(#bl)"/>
        <g transform="translate(200 215)">
          <use href="#leaf" transform="rotate(-125) scale(1.3)"/><use href="#leaf" transform="rotate(-72) scale(1.35)"/>
          <use href="#leaf" transform="rotate(32) scale(1.4)"/><use href="#leaf" transform="rotate(78) scale(1.3)"/>
          <use href="#leaf" transform="rotate(128) scale(1.3)"/><use href="#leaf" transform="rotate(-22) scale(1.3)"/>
        </g>
        <g stroke="#4a9a5c" stroke-width="5" stroke-linecap="round" fill="none"><path d="M200 300V424"/><path d="M158 290Q190 340 198 424"/><path d="M242 290Q210 340 202 424"/><path d="M180 300Q192 350 199 424" stroke-width="4"/></g>
        <path d="M168 336L232 336L224 402L176 402Z" fill="url(#rb)" stroke="#d9608f" stroke-width="1.5"/>
        <path d="M172 352H228M174 372H226" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>
        <g transform="translate(200 342)" fill="url(#rb)" stroke="#d9608f" stroke-width="2"><path d="M0 0Q-40 -26 -44 6Q-30 26 0 0Z"/><path d="M0 0Q40 -26 44 6Q30 26 0 0Z"/><path d="M0 0L-22 52Q-14 58 -8 50ZM0 0L22 52Q14 58 8 50Z"/><circle r="9"/></g>
        <g id="back"></g>
        <g>
          <use href="#rose" transform="translate(200 90) rotate(10) scale(.88)"/>
          <use href="#rose" transform="translate(120 120) rotate(40) scale(.9)"/>
          <use href="#rose" transform="translate(282 120) rotate(-20) scale(.9)"/>
          <use href="#rose" transform="translate(84 198) rotate(70) scale(.85)"/>
          <use href="#rose" transform="translate(316 198) rotate(25) scale(.87)"/>
          <use href="#rose" transform="translate(120 278) rotate(-40) scale(.9)"/>
          <use href="#rose" transform="translate(280 278) rotate(55) scale(.9)"/>
          <use href="#rose" transform="translate(200 300) rotate(15) scale(.8)"/>
          <use href="#rose" transform="translate(148 150) rotate(100) scale(.76)"/>
          <use href="#rose" transform="translate(252 150) rotate(-60) scale(.76)"/>
          <use href="#rose" transform="translate(148 248) rotate(20) scale(.74)"/>
          <use href="#rose" transform="translate(252 248) rotate(80) scale(.74)"/>
          <use href="#rose" transform="translate(200 198) rotate(30) scale(.98)"/>
        </g>
        <g id="front"></g>
      </svg>
    </div>

    <section class="wall" aria-label="Memórias">
      <div class="col"><figure class="pol"><div class="ph"></div></figure><figure class="pol"><div class="ph"></div></figure><figure class="pol"><div class="ph"></div></figure></div>
      <div class="col"><figure class="pol"><div class="ph"></div></figure><figure class="pol"><div class="ph"></div></figure><figure class="pol"><div class="ph"></div></figure></div>
    </section>
  </div>
</main>
<script>
(function(){
  var s=11,r=function(){return (s=(s*16807)%2147483647)/2147483647},C=['#35a7e6','#5bbcf0','#1f86c8','#7fd0f7'];
  function dots(n,a0,a1,stem){var o='';for(var i=0;i<n;i++){var a=r()*6.283,d=a0+r()*(a1-a0),cx=200+Math.cos(a)*d,cy=205+Math.sin(a)*d*.9,k=5+(r()*4|0);
    if(stem)o+='<path d="M200 215Q'+((200+cx)/2+8)+' '+((215+cy)/2)+' '+cx.toFixed(1)+' '+cy.toFixed(1)+'" stroke="#8cc79a" stroke-width=".9" fill="none"/>';
    for(var j=0;j<k;j++){var x=cx+(r()-.5)*36,y=cy+(r()-.5)*36,q=2.8+r()*2.8;
      o+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+q.toFixed(1)+'" fill="'+C[r()*4|0]+'"/><circle cx="'+(x-q*.3).toFixed(1)+'" cy="'+(y-q*.3).toFixed(1)+'" r="'+(q*.3).toFixed(1)+'" fill="#fff" opacity=".65"/>'}}return o}
  document.getElementById('back').innerHTML=dots(30,100,172,1);
  document.getElementById('front').innerHTML=dots(10,95,160,0);
  var h='',i;
  for(i=0;i<14;i++)h+='<i class="h" style="--x:'+(r()*100).toFixed(0)+'%;--d:'+(r()*10).toFixed(1)+'s;--s:'+(12+r()*22).toFixed(0)+'px;--t:'+(8+r()*6).toFixed(1)+'s">♥</i>';
  for(i=0;i<22;i++)h+='<i class="sp" style="--x:'+(r()*100).toFixed(0)+'%;--y:'+(r()*100).toFixed(0)+'%;--d:'+(r()*4).toFixed(1)+'s;--s:'+(8+r()*14).toFixed(0)+'px">✦</i>';
  for(i=0;i<12;i++)h+='<i class="pt" style="--x:'+(r()*100).toFixed(0)+'%;--d:'+(r()*12).toFixed(1)+'s;--t:'+(9+r()*6).toFixed(1)+'s"></i>';
  document.getElementById('fx').innerHTML=h;
})();
</script>
</body>
</html>
